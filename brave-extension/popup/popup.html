<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Mission Control</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon">⚡</div>
        <div class="brand-text">
          <span class="brand-title">ANTIGRAVITY</span>
          <span class="brand-sub">Mission Control</span>
        </div>
      </div>
      <div class="conn-status" id="conn-status">
        <span class="status-dot offline" id="status-dot"></span>
        <span class="status-text" id="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Active Task Card -->
    <section class="task-card">
      <div class="task-meta">
        <span class="subject-badge" id="task-subject">STANDBY</span>
        <span class="task-percent" id="task-percent">0%</span>
      </div>
      <h3 class="task-title" id="task-title">Ready for Automation</h3>
      <p class="task-step" id="task-step">No script currently running</p>
      
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Live Console -->
    <section class="console-section">
      <div class="console-header">
        <span class="console-label">REAL-TIME LOG STREAM</span>
        <div class="console-actions">
          <button class="mini-btn" id="btn-clear-logs" title="Clear console">Clear</button>
        </div>
      </div>
      <div class="console-box" id="console-box">
        <div class="log-entry info"><span class="log-time">00:00:00</span>Connecting to local telemetry daemon...</div>
      </div>
    </section>

    <!-- Quick Action Grid -->
    <section class="actions-section">
      <button class="action-btn primary" id="btn-check-status">
        <span class="btn-icon">📡</span>
        <span class="btn-label">Check Daemon Status</span>
      </button>
      <button class="action-btn" id="btn-test-directive">
        <span class="btn-icon">💡</span>
        <span class="btn-label">Ping Antigravity</span>
      </button>
      <button class="action-btn full-btn" id="btn-open-dashboard">
        <span class="btn-icon">🖥️</span>
        <span class="btn-label">Open Full Mission Control Dashboard</span>
      </button>
    </section>

    <!-- Footer Links -->
    <footer class="footer">
      <span class="footer-hint">Brave CDP Active on Port 9222</span>
      <span class="footer-version">v2.0 HUD</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
